name: Trend Briefing Cron

on:
  # 정기 실행은 Vercel Cron(vercel.json)이 담당. GitHub의 scheduled workflow는
  # 저장소에 60일간 push가 없으면 자동 비활성화되는 문제가 있어 schedule 트리거는 제거.
  workflow_dispatch:       # 수동 실행 / 백업용

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Trend Briefing Pipeline
        run: npx tsx scripts/run-pipeline.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
